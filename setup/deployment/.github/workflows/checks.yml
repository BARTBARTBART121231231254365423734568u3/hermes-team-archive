name: Deployment checks
true:
- push
- pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install aiohttp==3.14.3 PyYAML==6.0.3
    - run: python -m unittest discover -s tests -v
    - run: bash -n entrypoint.sh
    - name: Check pinned upstream patches
      run: "git clone --depth 1 --branch v2026.8.31 https://github.com/NousResearch/hermes-agent.git\
        \ /tmp/hermes-upstream\nfor patch in \"$GITHUB_WORKSPACE\"/patches/*.patch;\
        \ do\n  git -C /tmp/hermes-upstream apply --check \"$patch\"\n  git -C /tmp/hermes-upstream\
        \ apply \"$patch\"\ndone\n"

