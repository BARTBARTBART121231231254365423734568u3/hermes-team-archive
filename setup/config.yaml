model:
  provider: openai-codex
  default: gpt-6-sol
  base_url: https://chatgpt.com/backend-api/codex
  api_mode: codex_responses
fallback_providers:
- provider: muse-code
  model: muse-spark-1.3-contributor
toolsets:
- kanban
agent:
  agent_cache:
    max_size: 48
    memory_high_mb: '3072'
browser:
  backend: 'off'
  use_real_profile: true
checkpoints:
  enabled: true
context_file_max_chars: 60000
compression:
  proactive_prune_tokens: 48000
  model_thresholds:
    muse-code:muse-spark-1.3: 0.09
dashboard:
  basic_auth:
    username: admin
    password_hash: <REDACTED_SECRET>
    secret: <REDACTED_SECRET>
  public_url: https://hermes-agent-railway-production-b7ce.up.railway.app
memory:
  provider: ''
discord:
  require_mention: false
  free_response_channels: <REDACTED_SECRET>
  allowed_channels: <REDACTED_SECRET>
  no_thread_channels: <REDACTED_ID>
  notification_policy: decisions_only
  decision_owner_id: <REDACTED_SECRET>
  decision_dm_channel_id: <REDACTED_SECRET>
whatsapp:
  unauthorized_dm_behavior: ignore
approvals:
  mode: 'off'
  single_query_mode: deny
  deny:
  - git push --force*
  - git push * --force*
  - git push -f*
  - gh repo delete*
  - gh api *repos* -X DELETE*
  - railway service delete*
  - railway project delete*
  - railway volume delete*
  - railway environment delete*
  - rm -rf /*
  - rm -rf ~*
  - rm -rf .git*
plugins:
  enabled:
  - agent-watch
  - disk-cleanup
  - muse-code-subscription
  - observability/langfuse
  - quota
  - security-guidance
  disabled:
  - browser/browserbase
security:
  allow_data_training_tiers_noninteractive: true
kanban:
  dispatch_in_gateway: true
  failure_limit: 2
  max_in_progress: 2
  model_routing:
    roles:
      default:
        low:
          model: gpt-5.6-terra
          provider: openai-codex
        medium:
          model: gpt-6-sol
          provider: openai-codex
        hard:
          model: gpt-6-astra
          provider: openai-codex
      devops:
        low:
          model: gpt-5.6-terra
          provider: openai-codex
        medium:
          model: gpt-6-sol
          provider: openai-codex
        hard:
          model: gpt-6-astra
          provider: openai-codex
      security:
        low:
          model: gpt-5.6-terra
          provider: openai-codex
        medium:
          model: gpt-6-sol
          provider: openai-codex
        hard:
          model: gpt-6-astra
          provider: openai-codex
      planner:
